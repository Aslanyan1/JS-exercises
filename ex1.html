<!-- Sum of Digits of a Number -->
<html>

<body>
    <script>
        function num_c(number) {
            let res = 0;
            let num = 0;
            while (number) {
                num = number % 10;
                res += num;
                number = Math.round(number / 10);
            }
            return res;
        }
        let a = num_c(123)
        alert(a)
    </script>
</body>

</html>
