<!-- Check if a String is a Palindrome -->
<html>

<body>
    <script>
        function Polindrom(str) {
            let reversed = str.split("").reverse().join("");
            if (str == reversed) {
                alert(true);
            }
            else {
                alert(false);
            }
        }
        string = Polindrom("hello");
        alert(string);
    </script>
</body>

</html>
