<!-- Count How Many Times a Word Appears -->
<html>

<body>
    <script>
        let text = prompt("Enter the text:");
        let word = prompt("Enter the word:");
        let count = 0;
        for (let word2 of text.split(" ")) {
            if (word == word2) {
                count++;
            }
        }
        alert(count);
    </script>
</body>

</html>
