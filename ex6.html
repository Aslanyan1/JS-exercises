<html>

<body>
    <script>
        let text = prompt("Enter the text:").toLowerCase();
        let vowels = "aeiou";
        let allVowels = true;

        for (let el of text) {
            if (!vowels.includes(el)) {
                allVowels = false;
                break;
            }
        }

        alert(allVowels);
    </script>
</body>

</html>
