<!-- fibonacci -->
<body>
    <script>
        function fibonacci(n) {
            let phi = (1 + Math.sqrt(5)) / 2;
            let result = (phi ** n) / Math.sqrt(5);
            return Math.round(result);
        }
        let fib = fibonacci(5);
        alert(fib);
    </script>
</body>

</html>
